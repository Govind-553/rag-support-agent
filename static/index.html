<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aster &amp; Row Support Agent</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="logo">
        <span class="logo-mark">A&amp;R</span>
        <div>
          <div class="brand">Aster &amp; Row</div>
          <div class="tagline">AI Support Agent</div>
        </div>
      </div>
      <button class="btn-new" id="newChat" title="New conversation">&#x21BA; New</button>
    </header>

    <div class="messages" id="messages">
      <div class="message assistant">
        <div class="bubble">
          <p>Hi! I'm Aster &amp; Row's AI support agent. I can help you with orders, returns, shipping, warranties, and product questions.</p>
          <p>To look up an order, just share your order ID (e.g., <code>ORD-1007</code>).</p>
        </div>
      </div>
    </div>

    <div class="composer" id="composer">
      <textarea
        id="input"
        placeholder="Ask a question or provide your order ID…"
        rows="1"
        autofocus
      ></textarea>
      <button class="btn-send" id="send">&#x27A4;</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
